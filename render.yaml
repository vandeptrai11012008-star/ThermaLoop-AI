# Canonical ThermaLoop AI Web Service: website, Physics Lab, and remote agent API.
# This Blueprint deploys the agent-api service; it does not modify legacy sites.
services:
  - type: web
    name: thermaloop-agent-api
    runtime: node
    plan: free
    buildCommand: node scripts/build_agent_contract.cjs --check
    startCommand: node scripts/serve-agent-sandbox.cjs
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: THERMALOOP_API_TOKEN
        generateValue: true
      - key: THERMALOOP_MAX_EPISODES_PER_AGENT
        value: 4
