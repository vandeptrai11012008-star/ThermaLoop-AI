name: Scientific evidence and website regression
on: [push, pull_request]
jobs:
  validate:
    # Playwright 1.56 supports Ubuntu 24.04; do not follow the Ubuntu 26 runner migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_evidence.py --check
      - run: python scripts/build_validation.py --check
      - run: node --test tests/*.test.cjs
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py --artifacts /tmp/thermaloop-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-browser-results
          path: /tmp/thermaloop-browser-results
